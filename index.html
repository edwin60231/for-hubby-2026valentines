<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Hubby ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            /* 純粹且高質感的深灰色漸層背景 */
            background: linear-gradient(135deg, #232526, #414345);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            text-align: center;
        }

        .card {
            /* 深灰色毛玻璃效果 */
            background: rgba(30, 30, 35, 0.55);
            padding: 40px;
            border-radius: 24px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px); /* Safari 支援 */
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            max-width: 400px;
            width: 90%;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 28px;
            letter-spacing: 1px;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        p {
            margin-bottom: 30px;
            font-size: 15px;
            color: rgba(255, 255, 255, 0.65);
        }

        /* 播放按鈕 */
        .play-btn {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;
            border: none;
            padding: 12px 32px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 65, 108, 0.4);
            transition: all 0.3s ease;
        }

        .play-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 65, 108, 0.6);
        }

        .heart {
            font-size: 45px;
            margin-bottom: 15px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="heart">❤️</div>
        <h1>For My Hubby</h1>
        <p>點擊下方按鈕，聽聽專屬於我們的音樂</p>
        
        <!-- 音訊播放器設定 (請確認你的音樂檔名是否為 song.mp3) -->
        <audio id="bgm" loop>
            <source src="song.mp3" type="audio/mp3">
            您的瀏覽器不支援音訊播放元素。
        </audio>

        <button class="play-btn" id="playBtn">播放音樂 🎵</button>
    </div>

    <script>
        const audio = document.getElementById('bgm');
        const playBtn = document.getElementById('playBtn');

        playBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play();
                playBtn.textContent = '暫停音樂 ⏸';
            } else {
                audio.pause();
                playBtn.textContent = '播放音樂 🎵';
            }
        });

        // 嘗試自動播放
        window.addEventListener('load', () => {
            audio.play().then(() => {
                playBtn.textContent = '暫停音樂 ⏸';
            }).catch(error => {
                console.log("瀏覽器阻擋自動播放，等待使用者點擊。");
            });
        });
    </script>

</body>
</html>
