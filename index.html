
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Web Clone</title>
    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; height: 100%; background: #000; color: #b3b3b3; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
        .app-container { display: flex; height: 100vh; flex-direction: column; }
        
        /* Main Layout */
        .main-wrapper { display: flex; flex: 1; overflow: hidden; padding: 8px; gap: 8px; }
        
        /* Sidebar Left */
        .sidebar-left { width: 300px; background: #121212; border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 15px; }
        .sidebar-item { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .sidebar-item:hover { color: #fff; }
        .thumb { width: 48px; height: 48px; background: #333; border-radius: 4px; }
        
        /* Content Panel (Middle) */
        .content-panel { flex: 1; background: linear-gradient(to bottom, #4f4f4f, #121212); border-radius: 8px; overflow-y: auto; padding: 24px; color: #fff; }
        .hero-section { display: flex; align-items: flex-end; gap: 24px; padding-bottom: 24px; }
        .album-art { width: 232px; height: 232px; background: #333; box-shadow: 0 4px 60px rgba(0,0,0,0.5); }
        .playlist-title { font-size: 80px; font-weight: 900; margin: 0; }
        
        /* Sidebar Right */
        .sidebar-right { width: 300px; background: #121212; border-radius: 8px; padding: 16px; color: #fff; }
        
        /* Player Bar (Bottom) */
        .player-bar { height: 90px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #181818; }
        .play-btn { width: 56px; height: 56px; background: #1ed760; border-radius: 50%; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="main-wrapper">
            <aside class="sidebar-left">
                <h3>你的音樂庫</h3>
                <div class="sidebar-item"><div class="thumb"></div><div>已按讚的歌曲<br><small>播放清單 • @pw623</small></div></div>
                <div class="sidebar-item"><div class="thumb"></div><div>最Hit華語榜<br><small>播放清單 • Spotify</small></div></div>
                <div class="sidebar-item"><div class="thumb"></div><div>本機檔案<br><small>播放清單 • 1 首歌</small></div></div>
            </aside>
            <main class="content-panel">
                <div class="hero-section">
                    <div class="album-art"></div>
                    <div>
                        <p>公開的播放清單</p>
                        <h1 class="playlist-title">最Hit華語榜</h1>
                    </div>
                </div>
                <button class="play-btn">▶</button>
            </main>
            <aside class="sidebar-right">
                <h3>最Hit華語榜</h3>
                <div style="width: 100%; aspect-ratio: 1; background: #333; margin-bottom: 15px;"></div>
                <p>YihaoXingg</p>
            </aside>
        </div>
        <footer class="player-bar">
            <div>現在播放: 一半一半</div>
            <audio id="bgm" src="song.mp3"></audio>
            <button onclick="document.getElementById('bgm').play()">▶ 播放</button>
        </footer>
    </div>
</body>
</html>
